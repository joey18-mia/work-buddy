<!DOCTYPE html>
<html lang="en" data-theme="dark-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1525">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkBuddy">
<link rel="icon" href="/static/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/m/manifest.webmanifest">
<title>{% block title %}WorkBuddy{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
{% block head %}{% endblock %}
<link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body data-page="{% block page %}{% endblock %}" data-route-id="{% block route_id %}{% endblock %}">

<header class="m-topbar">
  <span class="m-logo">🌴 WorkBuddy</span>
</header>

<main class="m-main">
{% block content %}{% endblock %}
</main>

<nav class="m-nav">
  <a href="/m/" class="m-nav-item {% block nav_home %}{% endblock %}">
    <span class="m-nav-ico">🏠</span><span class="m-nav-lbl">Home</span></a>
  <a href="/m/routes" class="m-nav-item {% block nav_routes %}{% endblock %}">
    <span class="m-nav-ico">🛣️</span><span class="m-nav-lbl">Routes</span></a>
  <a href="/m/calendar" class="m-nav-item {% block nav_calendar %}{% endblock %}">
    <span class="m-nav-ico">📅</span><span class="m-nav-lbl">Calendar</span></a>
  <a href="/m/settings" class="m-nav-item {% block nav_settings %}{% endblock %}">
    <span class="m-nav-ico">⚙️</span><span class="m-nav-lbl">Settings</span></a>
</nav>

<script src="/static/js/mobile.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
